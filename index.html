<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>404 — Page introuvable · Qurios</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0d1f1a;color:#fff;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(26,122,86,.25) 0,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(37,211,102,.1) 0,transparent 50%);pointer-events:none}
.wrap{position:relative;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#1a7a56,#0d8a7e);display:grid;place-items:center;font-weight:800;font-size:26px;color:#fff;box-shadow:0 8px 24px rgba(26,122,86,.4);margin:0 auto 32px}
.code{font-size:clamp(80px,20vw,160px);font-weight:800;line-height:1;background:linear-gradient(135deg,#25d366,#1a7a56,#0d8a7e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-4px;margin-bottom:8px}
.title{font-size:clamp(18px,4vw,28px);font-weight:700;margin-bottom:14px}
.sub{font-size:clamp(13px,2.5vw,16px);color:rgba(255,255,255,.5);line-height:1.7;max-width:420px;margin:0 auto 40px}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.15;pointer-events:none}
.orb1{width:400px;height:400px;background:#25d366;top:-100px;right:-100px}
.orb2{width:300px;height:300px;background:#1a7a56;bottom:-80px;left:-80px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.emoji{font-size:64px;margin-bottom:16px;display:inline-block;animation:float 3s ease-in-out infinite}
.wa{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.3);font-size:13px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#25d366;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="wrap">
  <div class="logo">Q</div>
  <div class="emoji">🌿</div>
  <div class="code">404</div>
  <div class="title">Page introuvable</div>
  <p class="sub">La page que vous cherchez n'existe pas ou a été déplacée.</p>
  <div class="wa">
    <div class="dot"></div>
    qurios.tn · Compléments & Cosmétiques naturels
  </div>
</div>
</body>
</html>

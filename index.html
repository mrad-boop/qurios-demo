<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Qurios — Assistant WhatsApp</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',system-ui,sans-serif;background:#f0f4f2;color:#182420}
button{cursor:pointer;font-family:inherit}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#f0f4f2}::-webkit-scrollbar-thumb{background:#c5d4cc;border-radius:10px}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;display:inline-block}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ══ SUPABASE CONFIG ══ */
const SB_URL = "https://zixbpwwjweonianynvsq.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppeGJwd3dqd2VvbmlhbnludnNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTYyOTQsImV4cCI6MjA5NTgzMjI5NH0.5ndkLhjM5v8xtW-BfenVwPEdQlQs_a6DWXXffCRD0N8";

async function sb(table, opts={}) {
  const { method="GET", filter="", body=null, select="*" } = opts;
  let url = `${SB_URL}/rest/v1/${table}?select=${select}${filter}`;
  const res = await fetch(url, {
    method,
    headers: {
      "apikey": SB_KEY,
      "Authorization": `Bearer ${SB_KEY}`,
      "Content-Type": "application/json",
      "Prefer": method==="POST" ? "return=representation" : method==="PATCH" ? "return=representation" : "",
    },
    body: body ? JSON.stringify(body) : null,
  });
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

async function sbRpc(fn) {
  const res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}`, "Content-Type": "application/json" },
    body: "{}",
  });
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

/* ══ CONSTANTES ══ */
const OBJECTIFS_LIST = ["Perte de poids","Plus d'énergie","Peau et beauté","Stress et sommeil","Digestion","Cheveux & ongles","Immunité","Santé globale"];
const OBJECTIF_EMOJI = {"Perte de poids":"🔥","Plus d'énergie":"⚡","Peau et beauté":"✨","Stress et sommeil":"🌙","Digestion":"🌿","Cheveux & ongles":"💇","Immunité":"🛡️","Santé globale":"🌍"};
const STATUTS = ["Nouveau","Contacté","Confirmé","Expédié","Livré"];
const STATUT_C = {Nouveau:{bg:"#e8f0ff",fg:"#2563eb"},Contacté:{bg:"#fff4e0",fg:"#c2740a"},Confirmé:{bg:"#e7f7ed",fg:"#0f9d58"},Expédié:{bg:"#ede9ff",fg:"#6d28d9"},Livré:{bg:"#e1f6f4",fg:"#0d8a7e"}};

/* ══ UTILS ══ */
function now(){const d=new Date();return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0")}
function Bold({t}){return <span>{t.split(/(\*[^*]+\*)/g).map((p,i)=>p.startsWith("*")&&p.endsWith("*")?<strong key={i}>{p.slice(1,-1)}</strong>:<span key={i}>{p}</span>)}</span>}
function Badge({s}){const c=STATUT_C[s]||{bg:"#eee",fg:"#555"};return <span style={{padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:700,background:c.bg,color:c.fg}}>{s}</span>}
function Spinner(){return <span className="spin">⟳</span>}

/* ══════════════════════════════════════════
   WHATSAPP
══════════════════════════════════════════ */
function WA(){
  const [msgs,setMsgs]=useState([]);
  const [opts,setOpts]=useState([]);
  const [step,setStep]=useState("start");
  const [input,setInput]=useState("");
  const [inputMode,setInputMode]=useState(false);
  const [typing,setTyping]=useState(false);
  const [panier,setPanier]=useState([]);
  const [showPanier,setShowPanier]=useState(false);
  const [prenom,setPrenom]=useState("");
  const [produits,setProduits]=useState([]);
  const endRef=useRef(null);

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"})},[msgs,opts,typing]);

  // Charger produits depuis Supabase
  useEffect(()=>{
    sb("produits","*,categories(nom)").then(setProduits).catch(console.error);
  },[]);

  function bot(text){setMsgs(m=>[...m,{from:"bot",text,time:now()}])}
  function user(text){setMsgs(m=>[...m,{from:"user",text,time:now()}])}
  function delay(fn,d=700){setOpts([]);setTyping(true);setTimeout(()=>{setTyping(false);fn();},d)}

  function init(){
    bot("Bonjour 👋\n\nBienvenue chez *Qurios* — compléments alimentaires & cosmétiques naturels certifiés.\n\nComment puis-je vous aider ?");
    setOpts(["🔍 Trouver un produit adapté","🛒 Voir le catalogue","📦 Passer une commande","📲 Suivre ma commande","❓ FAQ"]);
  }
  useEffect(()=>{init();},[]);

  function reset(){
    setMsgs([]);setOpts([]);setStep("start");setInput("");
    setInputMode(false);setTyping(false);setPanier([]);setShowPanier(false);setPrenom("");
    setTimeout(()=>init(),150);
  }

  const total=()=>panier.reduce((s,i)=>s+(i.prix*i.qte),0);
  function addP(p){setPanier(prev=>{const ex=prev.find(x=>x.id===p.id);return ex?prev.map(x=>x.id===p.id?{...x,qte:x.qte+1}:x):[...prev,{...p,qte:1}]});}
  function updQte(id,d){setPanier(p=>p.map(x=>x.id===id?{...x,qte:Math.max(1,x.qte+d)}:x))}
  function delP(id){setPanier(p=>p.filter(x=>x.id!==id))}

  function showCat(cat){
    const items = cat==="all" ? produits : produits.filter(p=>p.categories?.nom===cat);
    delay(()=>{
      bot(`Voici notre sélection *${cat==="all"?"complète":cat}* :\nCliquez sur un produit pour l'ajouter au panier 🛒`);
      setStep("catalogue_show");
      setTimeout(()=>setMsgs(m=>[...m,{from:"bot",type:"catalogue",items,time:now()}]),100);
    });
  }

  function goToOrder(){
    if(!panier.length){delay(()=>{bot("Votre panier est vide ! Ajoutez d'abord des produits.");setOpts(["🛒 Voir le catalogue"]);setStep("catalogue_cat");});return;}
    const recap=panier.map(i=>`• ${i.nom} x${i.qte} — ${(i.prix*i.qte).toFixed(3)} TND`).join("\n");
    delay(()=>{
      bot(`🛒 *Récapitulatif :*\n\n${recap}\n\n💰 *Total : ${total().toFixed(3)} TND*\n\nPour finaliser, donnez-moi :\n\n• Nom complet\n• Téléphone\n• Ville\n• Adresse complète`);
      setInputMode(true);setStep("order_info");
    });
  }

  // Enregistrer commande dans Supabase
  async function saveCommande(infoText){
    const lines=infoText.split("\n");
    const get=(k)=>{const l=lines.find(x=>x.toLowerCase().includes(k));return l?l.split(":").slice(1).join(":").trim():""};
    const numero = await sbRpc("next_commande_numero");
    // Créer la commande
    const [cmd] = await sb("commandes",{method:"POST",body:{
      numero, client_nom:get("nom"), client_telephone:get("téléphone")||get("tel"),
      client_ville:get("ville"), client_adresse:get("adresse"),
      statut:"Nouveau", total:total()
    }});
    // Créer les items
    for(const item of panier){
      await sb("commande_items",{method:"POST",body:{
        commande_id:cmd.id, produit_id:item.id,
        produit_nom:item.nom, prix_unitaire:item.prix, quantite:item.qte
      }});
    }
    // Enregistrer le prospect
    const obj = panier[0]?.objectifs?.[0]||"";
    await sb("prospects",{method:"POST",body:{
      nom:get("nom"), telephone:get("téléphone")||get("tel"),
      objectif:obj, produit_recommande:panier.map(i=>i.nom).join(", "), statut:"Nouveau"
    }});
    return numero;
  }

  function handleOpt(opt){
    user(opt);setOpts([]);
    if(step==="start"){
      if(opt.includes("Trouver")){delay(()=>{bot("Quel est votre prénom ?");setInputMode(true);setStep("prenom");});}
      else if(opt.includes("catalogue")){delay(()=>{bot("Quelle catégorie ?");setOpts(["💊 Compléments alimentaires","🧴 Cosmétiques","🎁 Packs & Cures"]);setStep("catalogue_cat");});}
      else if(opt.includes("Passer")){panier.length>0?delay(()=>{bot("Vous avez des articles dans votre panier ✅");setOpts(["✅ Commander mon panier","🛍️ Modifier le panier","🔄 Nouveau choix"]);setStep("pre_order");}):delay(()=>{bot("Quelle catégorie ?");setOpts(["💊 Compléments alimentaires","🧴 Cosmétiques","🎁 Packs & Cures"]);setStep("catalogue_cat");});}
      else if(opt.includes("Suivre")){delay(()=>{bot("Indiquez votre numéro de commande (ex: CMD-1044) :");setInputMode(true);setStep("track");});}
      else{delay(()=>{bot("❓ *FAQ*\n\n• 🚚 Livraison 24–72h partout en Tunisie\n• 💵 Paiement à la livraison\n• ✅ Certifiés FSSC 22000 & GMP Halal\n• 📞 +216 22 352 000");setOpts(["🛒 Voir le catalogue","⬅️ Menu principal"]);});}
      return;
    }
    if(step==="catalogue_cat"){
      if(opt.includes("Compléments")) showCat("Compléments alimentaires");
      else if(opt.includes("Cosmétiques")) showCat("Cosmétiques");
      else if(opt.includes("Packs")) showCat("Packs & Cures");
      else reset();
      return;
    }
    if(step==="objectif"){
      const obj=opt.replace(/^.\s/,"");
      const recs=produits.filter(p=>p.objectifs?.includes(obj)).slice(0,4);
      delay(()=>{
        bot(`Pour *${obj}*, voici mes recommandations ${prenom?`pour vous ${prenom}`:""}:`);
        setTimeout(()=>{setMsgs(m=>[...m,{from:"bot",type:"catalogue",items:recs,time:now()}]);
          setOpts(["📦 Commander mon panier","🛒 Voir tout le catalogue","⬅️ Menu principal"]);setStep("post_reco");},200);
      });
      return;
    }
    if(step==="post_reco"||step==="catalogue_show"){
      if(opt.includes("Commander")) goToOrder();
      else if(opt.includes("catalogue")) {delay(()=>{bot("Quelle catégorie ?");setOpts(["💊 Compléments alimentaires","🧴 Cosmétiques","🎁 Packs & Cures"]);setStep("catalogue_cat");});}
      else reset();
      return;
    }
    if(step==="pre_order"){
      if(opt.includes("Commander mon panier")) goToOrder();
      else if(opt.includes("Modifier")){setShowPanier(true);}
      else {delay(()=>{bot("Quelle catégorie ?");setOpts(["💊 Compléments alimentaires","🧴 Cosmétiques","🎁 Packs & Cures"]);setStep("catalogue_cat");});}
      return;
    }
    if(step==="end") reset();
  }

  async function handleSend(){
    if(!input.trim())return;
    const val=input.trim();user(val);setInput("");setInputMode(false);
    if(step==="prenom"){
      setPrenom(val);
      delay(()=>{bot(`Enchanté *${val}* 😊\n\nQuel est votre objectif principal ?`);
        setOpts(OBJECTIFS_LIST.map(o=>`${OBJECTIF_EMOJI[o]} ${o}`));setStep("objectif");});
    } else if(step==="order_info"){
      setTyping(true);
      try {
        const num = await saveCommande(val);
        setTyping(false);
        bot(`✅ *Commande ${num} enregistrée !*\n\nMerci ${prenom} 🙏\n\nNotre équipe vous contacte dans les *2h* pour confirmer.\n\n📦 Livraison 24–72h · 💵 Paiement à la réception`);
        setPanier([]);setOpts(["↺ Nouvelle commande"]);setStep("end");
      } catch(e){
        setTyping(false);
        bot("❌ Erreur lors de l'enregistrement. Réessayez ou appelez le +216 22 352 000.");
        setOpts(["🔄 Réessayer","⬅️ Menu principal"]);
      }
    } else if(step==="track"){
      setTyping(true);
      try {
        const res = await sb("commandes",{filter:`&numero=eq.${val.toUpperCase()}&select=*,commande_items(*)`});
        setTyping(false);
        if(res.length){
          const c=res[0];
          bot(`📦 *${c.numero}*\nClient : ${c.client_nom}\nVille : ${c.client_ville}\nTotal : ${parseFloat(c.total).toFixed(3)} TND\nStatut : *${c.statut}* ${c.statut==="Livré"?"✅":c.statut==="Expédié"?"🚚":"⏳"}`);
        } else {
          bot(`Commande *${val.toUpperCase()}* introuvable.\nVérifiez le numéro ou appelez le *+216 22 352 000*.`);
        }
      } catch { setTyping(false); bot("Erreur de connexion. Réessayez."); }
      setOpts(["↺ Menu principal"]);setStep("end");
    }
  }

  function PCard({p}){
    const inCart=panier.find(x=>x.id===p.id);
    return(
      <div style={{background:"#fff",borderRadius:12,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,.08)",marginBottom:8,animation:"fadeIn .3s ease"}}>
        <div style={{display:"flex",gap:10,padding:10}}>
          <img src={p.img} alt={p.nom} style={{width:64,height:64,borderRadius:8,objectFit:"cover",flexShrink:0,background:"#f0f4f2"}} onError={e=>e.target.style.display="none"}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:4}}>
              <div style={{fontSize:13,fontWeight:700,lineHeight:1.3}}>{p.nom}</div>
              {p.badge&&<span style={{background:"#fff0f5",color:"#c2186a",fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:10,flexShrink:0,whiteSpace:"nowrap"}}>{p.badge}</span>}
            </div>
            <div style={{fontSize:11,color:"#666",marginTop:2,lineHeight:1.4}}>{p.description}</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:6}}>
              <div>
                {p.prix_promo&&<span style={{fontSize:10,color:"#999",textDecoration:"line-through",marginRight:4}}>{p.prix_promo} TND</span>}
                <span style={{fontWeight:800,color:"#1a7a56",fontSize:14}}>{parseFloat(p.prix).toFixed(3)} TND</span>
              </div>
              {inCart?(
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <button onClick={()=>updQte(p.id,-1)} style={{width:24,height:24,borderRadius:"50%",border:"1.5px solid #1a7a56",background:"#fff",color:"#1a7a56",fontWeight:700,fontSize:14,display:"grid",placeItems:"center"}}>−</button>
                  <span style={{fontWeight:700,minWidth:16,textAlign:"center"}}>{inCart.qte}</span>
                  <button onClick={()=>updQte(p.id,1)} style={{width:24,height:24,borderRadius:"50%",border:"none",background:"#1a7a56",color:"#fff",fontWeight:700,fontSize:14,display:"grid",placeItems:"center"}}>+</button>
                </div>
              ):(
                <button onClick={()=>{addP(p);bot(`✅ *${p.nom}* ajouté au panier !`);}} style={{background:"#1a7a56",color:"#fff",border:"none",padding:"5px 12px",borderRadius:8,fontSize:12,fontWeight:700}}>+ Panier</button>
              )}
            </div>
          </div>
        </div>
      </div>
    );
  }

  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:14}}>
      <div style={{width:360,background:"#111b17",borderRadius:34,padding:"10px 10px 0",boxShadow:"0 30px 80px rgba(0,0,0,.35)",display:"flex",flexDirection:"column",overflow:"hidden",height:680,position:"relative"}}>
        <div style={{display:"flex",justifyContent:"space-between",padding:"4px 16px 8px",color:"rgba(255,255,255,.6)",fontSize:11}}><span>9:41</span><span>5G 🔋</span></div>
        <div style={{background:"#075e54",display:"flex",alignItems:"center",gap:11,padding:"10px 14px 12px"}}>
          <div style={{width:38,height:38,borderRadius:"50%",background:"linear-gradient(135deg,#25d366,#0d8a7e)",display:"grid",placeItems:"center",fontWeight:800,color:"#fff",fontSize:18,flexShrink:0}}>Q</div>
          <div style={{flex:1}}><div style={{color:"#fff",fontWeight:700,fontSize:14.5}}>Qurios</div><div style={{color:"rgba(255,255,255,.75)",fontSize:11}}>Assistant • en ligne</div></div>
          {panier.length>0&&<button onClick={()=>setShowPanier(v=>!v)} style={{background:"#25d366",border:"none",borderRadius:20,padding:"4px 10px",color:"#fff",fontSize:12,fontWeight:700}}>🛒 {panier.length} • {total().toFixed(0)} TND</button>}
        </div>

        {/* Panier overlay */}
        {showPanier&&(
          <div style={{position:"absolute",zIndex:50,inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"flex-end"}}>
            <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:18,width:"100%",maxHeight:"75%",overflowY:"auto"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <span style={{fontWeight:800,fontSize:16}}>🛒 Mon Panier</span>
                <button onClick={()=>setShowPanier(false)} style={{border:"none",background:"#f0f4f2",borderRadius:20,padding:"4px 12px",fontWeight:600}}>Fermer</button>
              </div>
              {panier.map(i=>(
                <div key={i.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid #f0f4f2"}}>
                  <div style={{flex:1}}><div style={{fontWeight:600,fontSize:13}}>{i.nom}</div><div style={{fontSize:12,color:"#666"}}>{parseFloat(i.prix).toFixed(3)} TND</div></div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <button onClick={()=>updQte(i.id,-1)} style={{width:26,height:26,borderRadius:"50%",border:"1.5px solid #ddd",background:"#fff",fontWeight:700}}>−</button>
                    <span style={{fontWeight:700,minWidth:16,textAlign:"center"}}>{i.qte}</span>
                    <button onClick={()=>updQte(i.id,1)} style={{width:26,height:26,borderRadius:"50%",border:"none",background:"#1a7a56",color:"#fff",fontWeight:700}}>+</button>
                    <button onClick={()=>delP(i.id)} style={{border:"none",background:"none",color:"#e53e3e",fontSize:18}}>×</button>
                  </div>
                  <div style={{fontWeight:700,color:"#1a7a56",fontSize:13,minWidth:65,textAlign:"right"}}>{(parseFloat(i.prix)*i.qte).toFixed(3)}</div>
                </div>
              ))}
              <div style={{display:"flex",justifyContent:"space-between",marginTop:14,fontWeight:800,fontSize:15}}><span>Total</span><span style={{color:"#1a7a56"}}>{total().toFixed(3)} TND</span></div>
              <button onClick={()=>{setShowPanier(false);goToOrder();}} style={{width:"100%",background:"#1a7a56",color:"#fff",border:"none",padding:13,borderRadius:12,fontWeight:700,fontSize:15,marginTop:14}}>✅ Commander</button>
            </div>
          </div>
        )}

        <div style={{flex:1,background:"#e5ddd5",overflowY:"auto",padding:"12px 10px",display:"flex",flexDirection:"column",gap:6}}>
          {msgs.map((m,i)=>
            m.type==="catalogue"?(
              <div key={i} style={{alignSelf:"flex-start",width:"96%",animation:"fadeIn .4s ease"}}>
                {m.items.map(p=><PCard key={p.id} p={p}/>)}
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4}}>
                  <button onClick={()=>{if(panier.length>0)goToOrder();}} style={{background:"#1a7a56",color:"#fff",border:"none",padding:"7px 12px",borderRadius:8,fontSize:12,fontWeight:700,opacity:panier.length>0?1:0.5}}>📦 Commander ({panier.length})</button>
                  <button onClick={()=>{user("⬅️ Retour");delay(()=>{bot("Quelle catégorie ?");setOpts(["💊 Compléments alimentaires","🧴 Cosmétiques","🎁 Packs & Cures"]);setStep("catalogue_cat");});}} style={{background:"#fff",border:"1.5px solid #ddd",padding:"7px 12px",borderRadius:8,fontSize:12,fontWeight:600}}>⬅️ Retour</button>
                </div>
              </div>
            ):(
              <div key={i} style={{maxWidth:"84%",padding:"8px 11px 18px",borderRadius:10,fontSize:13,lineHeight:1.45,position:"relative",boxShadow:"0 1px 2px rgba(0,0,0,.1)",alignSelf:m.from==="bot"?"flex-start":"flex-end",background:m.from==="bot"?"#fff":"#dcf8c6",borderTopLeftRadius:m.from==="bot"?2:10,borderTopRightRadius:m.from==="user"?2:10,animation:"fadeIn .3s ease"}}>
                <span style={{whiteSpace:"pre-wrap"}}><Bold t={m.text}/></span>
                <span style={{position:"absolute",bottom:3,right:9,fontSize:9,color:"#7a857f"}}>{m.time}</span>
              </div>
            )
          )}
          {typing&&<div style={{alignSelf:"flex-start",background:"#fff",borderRadius:10,padding:"10px 14px",boxShadow:"0 1px 2px rgba(0,0,0,.08)"}}><span style={{display:"flex",gap:4}}>{[0,1,2].map(i=><span key={i} style={{width:7,height:7,borderRadius:"50%",background:"#aaa",display:"inline-block",animation:`bounce 1.2s ${i*0.2}s infinite`}}/>)}</span></div>}
          {opts.length>0&&<div style={{display:"flex",flexDirection:"column",gap:5,alignSelf:"flex-start",maxWidth:"90%",marginTop:2}}>{opts.map(o=><button key={o} onClick={()=>handleOpt(o)} style={{background:"#fff",border:"1.5px solid #b2dfce",color:"#075e54",padding:"9px 13px",borderRadius:10,fontSize:12.5,textAlign:"left",fontWeight:600,animation:"fadeIn .2s ease"}}>{o}</button>)}</div>}
          <div ref={endRef}/>
        </div>

        <div style={{display:"flex",alignItems:"flex-end",gap:7,padding:"8px 8px 10px",background:"#f0f0f0",borderTop:"1px solid #ddd"}}>
          {inputMode?(
            <><textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();handleSend()}}} placeholder="Votre message…" rows={step==="order_info"?4:1} style={{flex:1,border:"none",borderRadius:20,padding:"9px 14px",fontSize:13,resize:"none",outline:"none",fontFamily:"'DM Sans',sans-serif",maxHeight:100}}/><button onClick={handleSend} style={{width:38,height:38,borderRadius:"50%",border:"none",background:"#075e54",color:"#fff",fontSize:16,display:"grid",placeItems:"center",flexShrink:0}}>➤</button></>
          ):(
            <div style={{flex:1,background:"#fff",borderRadius:20,padding:"9px 14px",fontSize:12.5,color:"#9aa0a6"}}>Choisissez une option…</div>
          )}
        </div>
        {step==="order_info"&&inputMode&&(
          <button onClick={()=>setInput("Nom : Sonia Ben Ali\nTéléphone : 22 123 456\nVille : Tunis\nAdresse : Lac 2, Rue du Jasmin")} style={{background:"#128c7e",color:"#fff",border:"none",padding:"7px",fontSize:11.5}}>📋 Exemple</button>
        )}
      </div>
      <button onClick={reset} style={{background:"#fff",border:"1.5px solid #c8d8d2",padding:"9px 20px",borderRadius:10,fontSize:13,fontWeight:600,color:"#2c3a35"}}>↺ Recommencer</button>
    </div>
  );
}

/* ══════════════════════════════════════════
   DASHBOARD
══════════════════════════════════════════ */
function Dashboard(){
  const [tab,setTab]=useState("commandes");
  const [commandes,setCommandes]=useState([]);
  const [prospects,setProspects]=useState([]);
  const [produits,setProduits]=useState([]);
  const [categories,setCategories]=useState([]);
  const [loading,setLoading]=useState(true);
  const [mobile,setMobile]=useState(window.innerWidth<768);
  // Modals
  const [editProd,setEditProd]=useState(null);
  const [editCmd,setEditCmd]=useState(null);
  const [showAddProd,setShowAddProd]=useState(false);

  useEffect(()=>{const fn=()=>setMobile(window.innerWidth<768);window.addEventListener("resize",fn);return()=>window.removeEventListener("resize",fn);},[]);

  const load=useCallback(async()=>{
    setLoading(true);
    try {
      const [cmd,pros,prod,cat]=await Promise.all([
        sb("commandes",{filter:"&order=created_at.desc"}),
        sb("prospects",{filter:"&order=created_at.desc"}),
        sb("produits",{filter:"&order=created_at.asc&select=*,categories(nom)"}),
        sb("categories",{filter:"&order=ordre.asc"}),
      ]);
      setCommandes(cmd);setProspects(pros);setProduits(prod);setCategories(cat);
    } catch(e){console.error(e);}
    setLoading(false);
  },[]);

  useEffect(()=>{load();},[load]);

  // Stats
  const today=new Date().toISOString().split("T")[0];
  const cmdAuj=commandes.filter(c=>c.created_at?.startsWith(today)).length;
  const prosAuj=prospects.filter(p=>p.created_at?.startsWith(today)).length;
  const ca=commandes.filter(c=>c.statut!=="Nouveau"||true).reduce((s,c)=>s+parseFloat(c.total||0),0);

  async function updateStatut(table,id,statut){
    await sb(table,{method:"PATCH",filter:`&id=eq.${id}`,body:{statut}});
    load();
  }

  async function deleteProd(id){
    if(!confirm("Supprimer ce produit ?")) return;
    await sb("produits",{method:"DELETE",filter:`&id=eq.${id}`});
    load();
  }

  async function saveProd(data){
    if(data.id){
      await sb("produits",{method:"PATCH",filter:`&id=eq.${data.id}`,body:{...data,updated_at:new Date().toISOString()}});
    } else {
      await sb("produits",{method:"POST",body:data});
    }
    setEditProd(null);setShowAddProd(false);load();
  }

  function ProdModal({prod,onClose}){
    const [f,setF]=useState(prod||{nom:"",prix:"",emoji:"✨",description:"",badge:"",actif:true,categorie_id:categories[0]?.id||""});
    return(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
        <div style={{background:"#fff",borderRadius:20,padding:24,width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto"}}>
          <h3 style={{fontWeight:800,marginBottom:20,fontSize:18}}>{prod?"✏️ Modifier":"➕ Nouveau produit"}</h3>
          {[["Nom du produit","nom","text"],["Prix (TND)","prix","number"],["Emoji","emoji","text"],["Badge (optionnel)","badge","text"],["Description","description","text"]].map(([lbl,key,type])=>(
            <div key={key} style={{marginBottom:12}}>
              <label style={{fontSize:12,color:"#6b7875",fontWeight:600}}>{lbl}</label>
              <input type={type} value={f[key]||""} onChange={e=>setF(v=>({...v,[key]:e.target.value}))} style={{width:"100%",border:"1.5px solid #ddd",borderRadius:8,padding:"9px 12px",fontSize:14,marginTop:4,outline:"none"}}/>
            </div>
          ))}
          <div style={{marginBottom:12}}>
            <label style={{fontSize:12,color:"#6b7875",fontWeight:600}}>Catégorie</label>
            <select value={f.categorie_id||""} onChange={e=>setF(v=>({...v,categorie_id:e.target.value}))} style={{width:"100%",border:"1.5px solid #ddd",borderRadius:8,padding:"9px 12px",fontSize:14,marginTop:4}}>
              {categories.map(c=><option key={c.id} value={c.id}>{c.nom}</option>)}
            </select>
          </div>
          <div style={{marginBottom:16}}>
            <label style={{fontSize:12,color:"#6b7875",fontWeight:600}}>Actif</label>
            <input type="checkbox" checked={f.actif} onChange={e=>setF(v=>({...v,actif:e.target.checked}))} style={{marginLeft:8}}/>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>saveProd(f)} style={{flex:1,background:"#1a7a56",color:"#fff",border:"none",padding:12,borderRadius:10,fontWeight:700,fontSize:14}}>💾 Enregistrer</button>
            <button onClick={onClose} style={{flex:1,background:"#f0f4f2",border:"none",padding:12,borderRadius:10,fontWeight:700,fontSize:14}}>Annuler</button>
          </div>
        </div>
      </div>
    );
  }

  if(loading) return <div style={{textAlign:"center",padding:60,fontSize:18,color:"#1a7a56"}}><Spinner/> Chargement…</div>;

  return(
    <div>
      {(editProd||showAddProd)&&<ProdModal prod={editProd} onClose={()=>{setEditProd(null);setShowAddProd(false);}}/>}

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:mobile?"1fr 1fr":"repeat(4,1fr)",gap:12,marginBottom:20}}>
        {[[commandes.length,"Commandes","#1a7a56"],[prospects.length,"Prospects","#0d8a7e"],[cmdAuj,"Commandes auj.","#e879a6"],[ca.toFixed(0)+" TND","CA total","#f0a93c"]].map(([v,l,c])=>(
          <div key={l} style={{background:"#fff",borderRadius:14,padding:mobile?"14px":"20px",boxShadow:"0 2px 10px rgba(0,0,0,.05)",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:0,left:0,right:0,height:4,background:c,borderRadius:"14px 14px 0 0"}}/>
            <div style={{fontSize:mobile?26:32,fontWeight:800,color:c,lineHeight:1}}>{v}</div>
            <div style={{fontSize:12,color:"#5a6661",marginTop:6}}>{l}</div>
          </div>
        ))}
      </div>

      {/* Tabs */}
      <div style={{background:"#fff",borderRadius:16,padding:mobile?14:22,boxShadow:"0 2px 10px rgba(0,0,0,.05)"}}>
        <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}>
          {[["commandes","🛒 Commandes"],["prospects","👥 Prospects"],["produits","📦 Produits"]].map(([t,l])=>(
            <button key={t} onClick={()=>setTab(t)} style={{border:"none",background:tab===t?"#1a7a56":"#eef2f0",color:tab===t?"#fff":"#3a4742",padding:"9px 16px",borderRadius:10,fontWeight:700,fontSize:mobile?12:13.5,flex:mobile?"1":""}}>
              {l}
            </button>
          ))}
          <button onClick={load} style={{border:"none",background:"#f0f4f2",padding:"9px 14px",borderRadius:10,fontWeight:600,fontSize:13,marginLeft:"auto"}}>🔄</button>
        </div>

        {/* COMMANDES */}
        {tab==="commandes"&&(mobile?(
          commandes.map((c,i)=>(
            <div key={i} style={{background:"#f8faf9",borderRadius:12,padding:14,marginBottom:10,border:"1px solid #eef2f0"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                <span style={{fontWeight:800,color:"#1a7a56"}}>{c.numero}</span>
                <Badge s={c.statut}/>
              </div>
              <div style={{fontWeight:600,marginBottom:4}}>{c.client_nom}</div>
              <div style={{fontSize:12,color:"#6b7875",marginBottom:8}}>📍 {c.client_ville} · 📞 {c.client_telephone}</div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontWeight:800,color:"#1a7a56"}}>{parseFloat(c.total).toFixed(3)} TND</span>
                <select value={c.statut} onChange={e=>updateStatut("commandes",c.id,e.target.value)} style={{border:"1.5px solid #ddd",borderRadius:8,padding:"4px 8px",fontSize:12,background:"#fff"}}>
                  {STATUTS.map(s=><option key={s}>{s}</option>)}
                </select>
              </div>
            </div>
          ))
        ):(
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13.5}}>
              <thead><tr>{["Numéro","Client","Téléphone","Ville","Total","Date","Statut"].map(h=><th key={h} style={{textAlign:"left",padding:"10px 12px",color:"#6b7875",borderBottom:"2px solid #eef2f0",fontWeight:600,fontSize:12,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
              <tbody>{commandes.map((c,i)=>(
                <tr key={i} style={{borderBottom:"1px solid #f3f6f4"}}>
                  <td style={{padding:"12px",fontWeight:700,color:"#1a7a56"}}>{c.numero}</td>
                  <td style={{padding:"12px",fontWeight:600}}>{c.client_nom}</td>
                  <td style={{padding:"12px",color:"#5a6661"}}>{c.client_telephone}</td>
                  <td style={{padding:"12px"}}>{c.client_ville}</td>
                  <td style={{padding:"12px",fontWeight:700,color:"#1a7a56"}}>{parseFloat(c.total).toFixed(3)}</td>
                  <td style={{padding:"12px",color:"#5a6661",fontSize:12}}>{c.created_at?.slice(0,10)}</td>
                  <td style={{padding:"12px"}}>
                    <select value={c.statut} onChange={e=>updateStatut("commandes",c.id,e.target.value)} style={{border:"1.5px solid #ddd",borderRadius:8,padding:"4px 8px",fontSize:12,background:"#fff"}}>
                      {STATUTS.map(s=><option key={s}>{s}</option>)}
                    </select>
                  </td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        ))}

        {/* PROSPECTS */}
        {tab==="prospects"&&(mobile?(
          prospects.map((p,i)=>(
            <div key={i} style={{background:"#f8faf9",borderRadius:12,padding:14,marginBottom:10,border:"1px solid #eef2f0"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <span style={{fontWeight:700}}>{p.nom}</span>
                <Badge s={p.statut}/>
              </div>
              <div style={{fontSize:12,color:"#6b7875",marginBottom:4}}>📞 {p.telephone}</div>
              <div style={{fontSize:13,marginBottom:8}}>🎯 {p.objectif} → {p.produit_recommande}</div>
              <select value={p.statut} onChange={e=>updateStatut("prospects",p.id,e.target.value)} style={{border:"1.5px solid #ddd",borderRadius:8,padding:"5px 8px",fontSize:12,background:"#fff",width:"100%"}}>
                {STATUTS.map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
          ))
        ):(
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13.5}}>
              <thead><tr>{["Nom","Téléphone","Objectif","Produit","Date","Statut"].map(h=><th key={h} style={{textAlign:"left",padding:"10px 12px",color:"#6b7875",borderBottom:"2px solid #eef2f0",fontWeight:600,fontSize:12,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
              <tbody>{prospects.map((p,i)=>(
                <tr key={i} style={{borderBottom:"1px solid #f3f6f4"}}>
                  <td style={{padding:"12px",fontWeight:600}}>{p.nom}</td>
                  <td style={{padding:"12px",color:"#5a6661"}}>{p.telephone}</td>
                  <td style={{padding:"12px"}}>{p.objectif}</td>
                  <td style={{padding:"12px"}}>{p.produit_recommande}</td>
                  <td style={{padding:"12px",color:"#5a6661",fontSize:12}}>{p.created_at?.slice(0,10)}</td>
                  <td style={{padding:"12px"}}>
                    <select value={p.statut} onChange={e=>updateStatut("prospects",p.id,e.target.value)} style={{border:"1.5px solid #ddd",borderRadius:8,padding:"4px 8px",fontSize:12,background:"#fff"}}>
                      {STATUTS.map(s=><option key={s}>{s}</option>)}
                    </select>
                  </td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        ))}

        {/* PRODUITS */}
        {tab==="produits"&&(
          <div>
            <button onClick={()=>setShowAddProd(true)} style={{background:"#1a7a56",color:"#fff",border:"none",padding:"10px 20px",borderRadius:10,fontWeight:700,fontSize:14,marginBottom:16}}>+ Ajouter un produit</button>
            <div style={{display:"grid",gridTemplateColumns:mobile?"1fr":"repeat(auto-fill,minmax(300px,1fr))",gap:12}}>
              {produits.map(p=>(
                <div key={p.id} style={{background:"#f8faf9",borderRadius:12,padding:14,border:"1px solid #eef2f0",opacity:p.actif?1:0.5}}>
                  <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                    <img src={p.img} alt={p.nom} style={{width:56,height:56,borderRadius:8,objectFit:"cover",flexShrink:0,background:"#eef2f0"}} onError={e=>e.target.style.display="none"}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:14,marginBottom:2}}>{p.emoji} {p.nom}</div>
                      <div style={{fontSize:12,color:"#6b7875",marginBottom:4}}>{p.categories?.nom}</div>
                      <div style={{fontWeight:800,color:"#1a7a56",fontSize:15}}>{parseFloat(p.prix).toFixed(3)} TND</div>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:6,marginTop:10}}>
                    <button onClick={()=>setEditProd(p)} style={{flex:1,background:"#e8f0ff",color:"#2563eb",border:"none",padding:"7px",borderRadius:8,fontWeight:700,fontSize:13}}>✏️ Modifier</button>
                    <button onClick={()=>deleteProd(p.id)} style={{flex:1,background:"#ffe8e8",color:"#dc2626",border:"none",padding:"7px",borderRadius:8,fontWeight:700,fontSize:13}}>🗑️ Supprimer</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ══ APP ══ */

  useEffect(()=>{const fn=()=>setMobile(window.innerWidth<768);window.addEventListener("resize",fn);return()=>window.removeEventListener("resize",fn);},[]);

  return(
    <div style={{minHeight:"100vh",background:"#f0f4f2",color:"#182420",paddingBottom:mobile?72:0}}>

                <div style={{display:"inline-block",background:"#e7f7ed",color:"#0f7a4f",padding:"4px 12px",borderRadius:20,fontSize:11,fontWeight:700,marginBottom:10}}>SOLUTION RÉELLE · DONNÉES LIVE</div>
                <h1 style={{fontSize:24,fontWeight:800,lineHeight:1.2,fontFamily:"'Plus Jakarta Sans',sans-serif"}}>Boutique Qurios<br/><span style={{background:"linear-gradient(90deg,#1a7a56,#25d366)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>sur WhatsApp</span></h1>
              </div>
              <WA/>
            </div>
          ):(
            <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:48,alignItems:"start"}}>
              <div style={{paddingTop:12}}>
                <div style={{display:"inline-block",background:"#e7f7ed",color:"#0f7a4f",padding:"5px 14px",borderRadius:20,fontSize:12,fontWeight:700,marginBottom:18}}>SOLUTION RÉELLE · DONNÉES LIVE</div>
                <h1 style={{fontSize:38,fontWeight:800,lineHeight:1.12,marginBottom:16,fontFamily:"'Plus Jakarta Sans',sans-serif"}}>Votre boutique Qurios<br/><span style={{background:"linear-gradient(90deg,#1a7a56,#25d366)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>sur WhatsApp</span></h1>

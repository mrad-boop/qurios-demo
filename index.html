function now(){const d=new Date();return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0")}
function Bold({t}){
  return <span>{t.split(/(\*[^*]+\*)/g).map((p,i)=>p.startsWith("*")&&p.endsWith("*")?<strong key={i}>{p.slice(1,-1)}</strong>:<span key={i}>{p}</span>)}</span>;

/* ══════════════════════════════════════════
   WHATSAPP CHAT
══════════════════════════════════════════ */
function WA(){
  const [msgs,setMsgs]=useState([]);
  const [opts,setOpts]=useState([]);
  const [step,setStep]=useState("start");
  const [input,setInput]=useState("");
  const [inputMode,setInputMode]=useState(false);
  const [typing,setTyping]=useState(false);
  const [panier,setPanier]=useState([]);
  const [prodReco,setProdReco]=useState(null);
  const [showPanier,setShowPanier]=useState(false);
  const [prenom,setPrenom]=useState("");
  const endRef=useRef(null);

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"})},[msgs,opts,typing,showPanier]);

  function bot(text){setMsgs(m=>[...m,{from:"bot",text,time:now(),anim:true}])}
  function user(text){setMsgs(m=>[...m,{from:"user",text,time:now()}])}
  function delay(fn,d=700){setOpts([]);setTyping(true);setTimeout(()=>{setTyping(false);fn();},d)}

  function init(){
    bot("Bonjour 👋\n\nBienvenue chez *Qurios* — compléments alimentaires & cosmétiques naturels certifiés.\n\nJe suis votre assistant. Comment puis-je vous aider ?");
    setOpts(["🔍 Trouver un produit adapté","🛒 Voir le catalogue","📦 Passer une commande","📲 Suivre ma commande","❓ FAQ"]);
  }
  useEffect(()=>{init();},[]);

  function reset(){
    setMsgs([]);setOpts([]);setStep("start");setInput("");
    setInputMode(false);setTyping(false);setPanier([]);
    setProdReco(null);setShowPanier(false);setPrenom("");
    setTimeout(()=>init(),150);
  }

  function totalPanier(){return panier.reduce((s,i)=>s+(i.prix*i.qte),0)}
  function addPanier(prod){
    setPanier(p=>{const ex=p.find(x=>x.id===prod.id);
      return ex?p.map(x=>x.id===prod.id?{...x,qte:x.qte+1}:x):[...p,{...prod,qte:1}];});
  }
  function removeFromPanier(id){setPanier(p=>p.filter(x=>x.id!==id))}
  function updateQte(id,delta){
    setPanier(p=>p.map(x=>x.id===id?{...x,qte:Math.max(1,x.qte+delta)}:x));
  }

  function handleOpt(opt){
    const label = opt.replace(/^[^\s]+\s/,""); // enlever l'emoji du début si menu principal
    user(opt); setOpts([]);

    /* ── Menu principal ── */
    if(step==="start"){
      if(opt.includes("Trouver")){
        delay(()=>{bot("Quel est votre prénom ?");setInputMode(true);setStep("prenom");});
      } else if(opt.includes("catalogue")){
        delay(()=>{bot("Quelle catégorie vous intéresse ?");setOpts(["💊 Compléments alimentaires","🧴 Cosmétiques","🎁 Packs & Cures","⬅️ Retour"]);setStep("catalogue_cat");});
      } else if(opt.includes("commande")&&opt.includes("Passer")){
        if(panier.length>0){
          delay(()=>{bot("Vous avez des articles dans votre panier ✅\n\nSouhaitez-vous commander le contenu de votre panier ou choisir d'autres produits ?");setOpts(["✅ Commander mon panier","🛍️ Modifier le panier","🔄 Nouveau choix"]);setStep("pre_order");});
        } else {
          delay(()=>{bot("Votre panier est vide. Commençons par choisir vos produits !");setOpts(["💊 Compléments alimentaires","🧴 Cosmétiques","🎁 Packs & Cures"]);setStep("catalogue_cat");});
        }
      } else if(opt.includes("Suivre")){
        delay(()=>{bot("Indiquez votre numéro de commande (ex: CMD-1042) :");setInputMode(true);setStep("track");});
      } else if(opt.includes("FAQ")){
        delay(()=>{bot("❓ *Questions fréquentes*\n\n• 🚚 Livraison 24–72h partout en Tunisie\n• 💵 Paiement à la livraison disponible\n• ✅ Produits certifiés FSSC 22000 & GMP\n• 🔄 Retour sous 7 jours si insatisfait\n• 📞 Service client : +216 22 352 000");
          setOpts(["🔍 Trouver un produit","🛒 Voir le catalogue","⬅️ Menu principal"]);setStep("faq");});
      }
      return;
    }

    /* ── FAQ → retour ── */
    if(step==="faq"){reset();return;}

    /* ── Catalogue catégorie ── */
    if(step==="catalogue_cat"){
      if(opt.includes("Retour")||opt.includes("Menu")){reset();return;}
      let produits=[];
      if(opt.includes("Compléments")) produits=CATALOGUE.complements;
      else if(opt.includes("Cosmétiques")) produits=CATALOGUE.cosmetiques;
      else if(opt.includes("Packs")) produits=CATALOGUE.packs;
      delay(()=>{
        bot(`Voici notre sélection ${opt.includes("Compléments")?"compléments alimentaires":opt.includes("Cosmétiques")?"cosmétiques":"packs & cures"} :\n\nCliquez sur un produit pour l'ajouter au panier 🛒`);
        setStep("catalogue_show");
        setTimeout(()=>{
          setMsgs(m=>[...m,{from:"bot",type:"catalogue",items:produits,time:now()}]);
        },100);
      });
      return;
    }

    /* ── Objectif ── */
    if(step==="objectif"){
      const obj=opt.replace(/^.\s/,"");
      const recs=ALL_PRODUCTS.filter(p=>p.objectifs&&p.objectifs.includes(obj)).slice(0,4);
      delay(()=>{
        if(recs.length===0){
          bot("Je n'ai pas trouvé de produit pour cet objectif. Consultez notre catalogue !");
          setOpts(["🛒 Voir le catalogue","⬅️ Menu principal"]);setStep("start");
        } else {
          bot(`Super ${prenom} ! Pour *${obj}*, voici mes recommandations personnalisées :`);
          setTimeout(()=>{
            setMsgs(m=>[...m,{from:"bot",type:"catalogue",items:recs,time:now()}]);
            setOpts(["🛒 Voir tout le catalogue","📦 Commander mon panier","⬅️ Menu principal"]);
            setStep("post_reco");
          },200);
        }
      });
      return;
    }

    /* ── Post recommandation ── */
    if(step==="post_reco"){
      if(opt.includes("catalogue")){delay(()=>{bot("Quelle catégorie ?");setOpts(["💊 Compléments alimentaires","🧴 Cosmétiques","🎁 Packs & Cures"]);setStep("catalogue_cat");});}
      else if(opt.includes("Commander")){goToOrder();}
      else {reset();}
      return;
    }

    /* ── Pre-order ── */
    if(step==="pre_order"){
      if(opt.includes("Commander mon panier")){goToOrder();}
      else if(opt.includes("Modifier")){setShowPanier(true);setOpts([]);}
      else {delay(()=>{bot("Quelle catégorie ?");setOpts(["💊 Compléments alimentaires","🧴 Cosmétiques","🎁 Packs & Cures"]);setStep("catalogue_cat");});}
      return;
    }

    /* ── Catalogue show ── */
    if(step==="catalogue_show"){
      if(opt.includes("panier")||opt.includes("Commander")){goToOrder();}
      else if(opt.includes("Retour")||opt.includes("Menu")){reset();}
      else {delay(()=>{bot("Quelle catégorie ?");setOpts(["💊 Compléments alimentaires","🧴 Cosmétiques","🎁 Packs & Cures","⬅️ Menu principal"]);setStep("catalogue_cat");});}
      return;
    }

    /* ── Action post-order ── */
    if(step==="end"){reset();return;}
  }

  function goToOrder(){
    if(panier.length===0){
      delay(()=>{bot("Votre panier est vide ! Ajoutez d'abord des produits.");
        setOpts(["🛒 Voir le catalogue"]);setStep("catalogue_cat");});
      return;
    }
    const recap=panier.map(i=>`• ${i.nom} x${i.qte} — ${(i.prix*i.qte).toFixed(3)} TND`).join("\n");
    delay(()=>{
      bot(`🛒 *Récapitulatif de votre panier :*\n\n${recap}\n\n💰 *Total : ${totalPanier().toFixed(3)} TND*\n\nPour finaliser, donnez-moi vos informations de livraison :\n\n• Nom complet\n• Téléphone\n• Ville\n• Adresse complète`);
      setInputMode(true);setStep("order_info");
    });
  }

  function handleSend(){
    if(!input.trim())return;
    const val=input.trim(); user(val); setInput(""); setInputMode(false);

    if(step==="prenom"){
      setPrenom(val);
      delay(()=>{
        bot(`Enchanté *${val}* 😊\n\nQuel est votre objectif principal ?`);
        setOpts(OBJECTIFS_LIST.map(o=>`${OBJECTIF_EMOJI[o]} ${o}`));
        setStep("objectif");
      });
    } else if(step==="order_info"){
      delay(()=>{
        const num="CMD-"+(1043+Math.floor(Math.random()*10));

          {typing&&(
            <div style={{alignSelf:"flex-start",background:"#fff",borderRadius:10,padding:"10px 14px",boxShadow:"0 1px 2px rgba(0,0,0,.08)"}}>

function StatCard({label,value,sub,color}){
  return(
    <div style={{background:"#fff",borderRadius:16,padding:"22px 22px 18px",position:"relative",overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,.05)"}}>
      <div style={{position:"absolute",top:0,left:0,right:0,height:4,background:color,borderRadius:"16px 16px 0 0"}}/>
      <div style={{fontSize:36,fontWeight:800,fontFamily:"'Plus Jakarta Sans',sans-serif",color,lineHeight:1}}>{value}</div>
      <div style={{fontSize:13,color:"#5a6661",marginTop:6,fontWeight:500}}>{label}</div>
      {sub&&<div style={{fontSize:12,color:"#0f9d58",marginTop:8,fontWeight:700}}>▲ {sub}</div>}
    </div>
  );
}
function BarChart(){
  const max=Math.max(...P_MOIS,...C_MOIS)*1.2;
  return(
    <div>
      <div style={{display:"flex",gap:18,fontSize:12,color:"#6b7875",marginBottom:14}}>
        <span><i style={{display:"inline-block",width:10,height:10,borderRadius:3,background:"#1a7a56",marginRight:5}}/> Prospects</span>
        <span><i style={{display:"inline-block",width:10,height:10,borderRadius:3,background:"#9be3c4",marginRight:5}}/> Commandes</span>
      </div>
      <div style={{display:"flex",alignItems:"flex-end",gap:10,height:160}}>
        {MOIS.map((l,i)=>(
          <div key={l} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",height:"100%"}}>
            <div style={{flex:1,display:"flex",alignItems:"flex-end",gap:3,width:"100%",justifyContent:"center"}}>
              <div style={{width:12,background:"#1a7a56",height:`${(P_MOIS[i]/max)*100}%`,borderRadius:"3px 3px 0 0"}}/>
              <div style={{width:12,background:"#9be3c4",height:`${(C_MOIS[i]/max)*100}%`,borderRadius:"3px 3px 0 0"}}/>
            </div>
            <div style={{fontSize:11,color:"#6b7875",marginTop:6}}>{l}</div>
          </div>
        ))}
      </div>
    </div>
  );
}
function HBar(){
  const max=Math.max(...PROD_TOP.map(d=>d.val));
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {PROD_TOP.map(d=>(
        <div key={d.nom}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:5}}>
            <span style={{fontWeight:500}}>{d.nom}</span>
            <span style={{fontWeight:700,color:d.color}}>{d.val}</span>
          </div>
          <div style={{background:"#eef2f0",borderRadius:6,height:10,overflow:"hidden"}}>
            <div style={{width:`${(d.val/max)*100}%`,height:"100%",background:d.color,borderRadius:6}}/>
          </div>
        </div>
      ))}
    </div>
  );
}
function Donut(){
  const total=BESOINS.reduce((s,d)=>s+d.val,0);
  let acc=0;
  const grad=BESOINS.map(d=>{const s=(acc/total)*360;acc+=d.val;const e=(acc/total)*360;return `${d.color} ${s}deg ${e}deg`;}).join(",");
  return(
    <div style={{display:"flex",gap:28,alignItems:"center",flexWrap:"wrap"}}>
      <div style={{width:140,height:140,borderRadius:"50%",background:`conic-gradient(${grad})`,position:"relative",flexShrink:0,boxShadow:"0 4px 20px rgba(0,0,0,.1)"}}>
        <div style={{position:"absolute",inset:30,background:"#fff",borderRadius:"50%",display:"grid",placeItems:"center",textAlign:"center"}}>
          <div><div style={{fontSize:22,fontWeight:800,fontFamily:"'Plus Jakarta Sans',sans-serif"}}>{total}</div><div style={{fontSize:10,color:"#9aa5a0"}}>clients</div></div>
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:9}}>
        {BESOINS.map(d=>(
          <div key={d.nom} style={{display:"flex",alignItems:"center",gap:8,fontSize:13}}>
            <i style={{display:"inline-block",width:10,height:10,borderRadius:3,background:d.color,flexShrink:0}}/>
            <span>{d.nom}</span>
            <strong style={{marginLeft:"auto",paddingLeft:12,color:d.color}}>{Math.round(d.val/total*100)}%</strong>
          </div>
        ))}
      </div>
    </div>
  );
}

              <p style={{fontSize:16,color:"#4a5c55",lineHeight:1.7,maxWidth:480,marginBottom:28}}>

              <div style={{display:"flex",flexDirection:"column",gap:14,marginBottom:28}}>

                  ["🛒","Catalogue réel qurios.tn — 20+ produits avec prix"],

                  ["🧺","Panier interactif — ajout, modification, suppression"],
                  ["📦","Commande en 1 message — livraison à domicile"],
                  ["📊","Chaque vente remonte au Dashboard Admin"],

                  <div key={t} style={{display:"flex",alignItems:"center",gap:12,fontSize:14.5,color:"#2c3a35"}}>

              </div>
              <div style={{background:"linear-gradient(135deg,#e7f7ed,#d4f0e5)",padding:"14px 18px",borderRadius:13,display:"inline-flex",alignItems:"center",gap:10,fontSize:13.5,fontWeight:600,color:"#0f7a4f",border:"1px solid #b2dfce"}}>

      <footer style={{textAlign:"center",padding:"20px",color:"#9aa5a0",fontSize:12.5,borderTop:"1px solid #e4ece8",background:"#fff"}}>

}
